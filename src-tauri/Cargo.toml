[package]
name = "idol-studio"
version = "0.4.0"
description = "Idol Studio: turn single images into 3D Gaussian splats with Idol"
authors = ["Jørn Tillnes"]
edition = "2021"
default-run = "idol-studio"

[lib]
name = "idol_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "idol-studio"
path = "src/main.rs"

# Console build of the command line interface (same commands as `idol-studio.exe <command>`).
[[bin]]
name = "idol-studio-cli"
path = "src/bin/idol-studio-cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
semver = "1"
tokio = { version = "1", features = ["time", "fs", "io-util"] }
futures-util = "0.3"
dirs = "6"
clap = { version = "4", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_JobObjects", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.55"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
