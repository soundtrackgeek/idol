[package]
name = "idol-studio"
version = "0.1.1"
description = "Idol Studio: turn single images into 3D Gaussian splats with Idol"
authors = ["Jørn Tillnes"]
edition = "2021"

[lib]
name = "idol_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
semver = "1"
tokio = { version = "1", features = ["time", "fs", "io-util"] }
futures-util = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
